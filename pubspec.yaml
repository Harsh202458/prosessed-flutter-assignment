name: shopsphere
description: "ShopSphere - e-commerce catalogue app built on DummyJSON"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.3
  connectivity_plus: ^7.3.2
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  pretty_dio_logger: ^1.4.0
  shimmer: ^4.0.0
  smooth_page_indicator: ^3.0.0
  stream_transform: ^2.1.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-400.ttf
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-600.ttf
          weight: 600
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: '#C00001'
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 26
